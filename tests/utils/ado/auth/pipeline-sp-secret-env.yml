# Service principal + secret, supplied via env vars (baseline / mirrors today's PR pipeline auth path).
# auth_source defaults to `auto`; with AZURE_CLIENT_ID/SECRET/TENANT/SUBSCRIPTION_ID set,
# AzureRMAuth._get_credentials() takes the "received credentials from parameters" branch
# (params come pre-filled from env via AnsibleModule arg defaults).

trigger: none
pr: none

parameters:
  - name: PYTHON_VER
    type: string
    default: "3.13"
  - name: ANSIBLE_VER
    type: string
    default: "2.18"

extends:
  template: template-auth-pipeline.yml
  parameters:
    pipelineDisplayName: 'Auth smoke - SP secret (env vars)'
    authSourceLabel: 'sp-secret-env (auto)'
    pythonVer: ${{ parameters.PYTHON_VER }}
    ansibleVer: ${{ parameters.ANSIBLE_VER }}
    extraEnv:
      AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
      AZURE_SECRET: $(AZURE_SECRET)
      AZURE_TENANT: $(AZURE_TENANT)
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
