# OIDC / federated workload identity - token read from FILE on disk.
# Exercises the ClientAssertionCredential branch keyed by
# `oidc_token_file_path` (env var AZURE_FEDERATED_TOKEN_FILE).

trigger: none
pr: none

parameters:
  - name: PYTHON_VER
    type: string
    default: "3.13"
  - name: ANSIBLE_VER
    type: string
    default: "2.18"

extends:
  template: template-auth-pipeline.yml
  parameters:
    pipelineDisplayName: 'Auth smoke - OIDC token file (workload identity)'
    authSourceLabel: 'oidc-token-file (auto)'
    pythonVer: ${{ parameters.PYTHON_VER }}
    ansibleVer: ${{ parameters.ANSIBLE_VER }}
    preAuthSteps:
      - task: AzureCLI@2
        displayName: 'Mint federated OIDC token and write to file'
        inputs:
          azureSubscription: '$(OIDC_SERVICE_CONNECTION)'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          addSpnToEnvironment: true
          inlineScript: |
            set -eu
            : "${idToken:?idToken not exported}"
            umask 077
            TOKEN_FILE="$(Agent.TempDirectory)/azure-federated-token"
            set +x
            printf '%s' "$idToken" > "$TOKEN_FILE"
            set -x
            echo "##vso[task.setvariable variable=AZURE_CLIENT_ID]${servicePrincipalId}"
            echo "##vso[task.setvariable variable=AZURE_TENANT]${tenantId}"
            echo "##vso[task.setvariable variable=AZURE_FEDERATED_TOKEN_FILE]${TOKEN_FILE}"
    extraEnv:
      AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
      AZURE_TENANT: $(AZURE_TENANT)
      AZURE_FEDERATED_TOKEN_FILE: $(AZURE_FEDERATED_TOKEN_FILE)
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
