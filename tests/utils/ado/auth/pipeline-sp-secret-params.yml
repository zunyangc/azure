# Service principal + secret passed as MODULE PARAMETERS (not env).
# Verifies the "module params" branch of AzureRMAuth._get_credentials.
#
# Auth values are passed via AUTH_SMOKE_* env vars (namespaced so AzureRMAuth's
# automatic AZURE_* env pickup cannot satisfy auth) and surfaced into
# module_defaults by auth_smoke/tasks/main.yml. We deliberately do NOT set
# any AZURE_* env vars here, so the only working auth path is module params.

trigger: none
pr: none

parameters:
  - name: PYTHON_VER
    type: string
    default: "3.13"
  - name: ANSIBLE_VER
    type: string
    default: "2.18"

extends:
  template: template-auth-pipeline.yml
  parameters:
    pipelineDisplayName: 'Auth smoke - SP secret (module params)'
    authSourceLabel: 'sp-secret-params (auto)'
    pythonVer: ${{ parameters.PYTHON_VER }}
    ansibleVer: ${{ parameters.ANSIBLE_VER }}
    extraEnv:
      AUTH_SMOKE_CLIENT_ID: $(AZURE_CLIENT_ID)
      AUTH_SMOKE_SECRET: $(AZURE_SECRET)
      AUTH_SMOKE_TENANT: $(AZURE_TENANT)
      AUTH_SMOKE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
