# Credential file (~/.azure/credentials), DEFAULT profile.
# Exercises auth_source=credential_file with the [default] section.

trigger: none
pr: none

parameters:
  - name: PYTHON_VER
    type: string
    default: "3.13"
  - name: ANSIBLE_VER
    type: string
    default: "2.18"

extends:
  template: template-auth-pipeline.yml
  parameters:
    pipelineDisplayName: 'Auth smoke - credential file (default profile)'
    authSourceLabel: 'credential_file (default)'
    pythonVer: ${{ parameters.PYTHON_VER }}
    ansibleVer: ${{ parameters.ANSIBLE_VER }}
    preAuthSteps:
      - bash: |
          set -eu
          umask 077
          mkdir -p "${HOME}/.azure"
          set +x
          cat > "${HOME}/.azure/credentials" <<EOF
          [default]
          subscription_id=${AZURE_SUBSCRIPTION_ID_SECRET}
          client_id=${AZURE_CLIENT_ID_SECRET}
          secret=${AZURE_SECRET_SECRET}
          tenant=${AZURE_TENANT_SECRET}
          EOF
          set -x
          chmod 600 "${HOME}/.azure/credentials"
        displayName: 'Write ~/.azure/credentials'
        env:
          AZURE_CLIENT_ID_SECRET: $(AZURE_CLIENT_ID)
          AZURE_SECRET_SECRET: $(AZURE_SECRET)
          AZURE_TENANT_SECRET: $(AZURE_TENANT)
          AZURE_SUBSCRIPTION_ID_SECRET: $(AZURE_SUBSCRIPTION_ID)
    extraEnv:
      AUTH_SMOKE_AUTH_SOURCE: 'credential_file'
